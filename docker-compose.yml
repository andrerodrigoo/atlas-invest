services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_invest
    ports:
      - "5432:5432"
    volumes:
      - atlas_invest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_invest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      API_VERSION: v1
      DATABASE_URL: "postgresql://atlas:atlas@postgres:5432/atlas_invest?schema=public"
      JWT_SECRET: "dev_jwt_secret_troque_em_producao"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_SECRET: "dev_jwt_refresh_secret_troque_em_producao"
      JWT_REFRESH_EXPIRES_IN: "30d"
      PIN_HASH_PEPPER: "dev_pin_pepper_troque_em_producao"
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:3000/api/v1"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  atlas_invest_pgdata:
